# AI Workspace backend configuration.
# Every value can be overridden with environment variables (explicit placeholders below, or Spring's relaxed
# binding, e.g. LLM_PROVIDERS_QWEN_TIMEOUT=PT300S).

spring:
  application:
    name: ai-workspace
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/aichat}
    username: ${DB_USERNAME:aichat}
    password: ${DB_PASSWORD:aichat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    async:
      # Upper bound for a streamed answer (local models can be slow).
      request-timeout: ${CHAT_STREAM_TIMEOUT:PT15M}
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: always
  servlet:
    multipart:
      # Knowledge-base uploads; keep in sync with rag.ingestion.max-file-size (and nginx client_max_body_size).
      max-file-size: ${RAG_MAX_FILE_SIZE:50MB}
      max-request-size: ${RAG_MAX_REQUEST_SIZE:55MB}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful
  # Trust X-Forwarded-* headers from the reverse proxy (needed for per-IP rate limits behind nginx).
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    # Read oversized uploads to the end so the client receives a proper 413 response.
    max-swallow-size: ${RAG_MAX_REQUEST_SIZE:55MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        llm.request.duration: true
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: AI Workspace
    description: Provider-agnostic AI chat

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    root: INFO
    com.example.aichat: INFO
    # Never log request/response bodies or headers of LLM calls (prompts and API keys).
    org.springframework.web.reactive.function.client: WARN
    reactor.netty.http.client: WARN
    org.hibernate.SQL: WARN
    # Document parsers are chatty about fonts and layout; never log document content.
    org.apache.pdfbox: ERROR
    org.apache.fontbox: ERROR
    org.apache.poi: WARN
    org.apache.tika: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# --------------------------------------------------------------------------------------------------------------------
# Application
# --------------------------------------------------------------------------------------------------------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3080}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    jwt:
      # >= 32 bytes. When empty, a random key is generated at startup (tokens do not survive restarts).
      secret: ${JWT_SECRET:}
      issuer: ai-workspace
      access-token-ttl: ${JWT_TTL:PT12H}
  accounts:
    registration-enabled: ${REGISTRATION_ENABLED:true}
    # The first registered user becomes administrator if no administrator exists yet.
    first-user-admin: ${FIRST_USER_ADMIN:true}
    max-failed-logins: 5
    lockout-duration: PT15M
    bootstrap-admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:admin@localhost}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      - name: auth
        paths: [ /api/auth/login, /api/auth/register ]
        methods: [ POST ]
        key: IP
        capacity: 10
        refill-period: PT1M
      - name: chat
        paths: [ /api/chat, /api/chat/stream, /api/chat/regenerate ]
        methods: [ POST ]
        key: USER
        capacity: ${CHAT_RATE_LIMIT:30}
        refill-period: PT1M
      - name: compare
        paths: [ /api/compare/** ]
        methods: [ POST ]
        key: USER
        capacity: ${COMPARE_RATE_LIMIT:10}
        refill-period: PT1M
      - name: health-refresh
        paths: [ /api/providers/*/health ]
        methods: [ GET ]
        key: USER
        capacity: 30
        refill-period: PT1M

chat:
  max-message-length: ${CHAT_MAX_MESSAGE_LENGTH:32000}
  max-concurrent-generations-per-user: 3
  heartbeat-interval: PT15S
  stale-generation-age: PT30M
  context:
    # FULL_CONTEXT | LAST_N_MESSAGES | TOKEN_WINDOW | SUMMARY_PLUS_RECENT
    strategy: ${CHAT_CONTEXT_STRATEGY:SUMMARY_PLUS_RECENT}
    max-context-tokens: ${CHAT_CONTEXT_MAX_TOKENS:8000}
    last-n-messages: 20
    summary-trigger-tokens: ${CHAT_SUMMARY_TRIGGER_TOKENS:6000}
    summary-keep-recent-messages: 6
    chars-per-token: 3.5
  title:
    # LLM | HEURISTIC
    mode: ${CHAT_TITLE_MODE:LLM}
    max-tokens: 512
    timeout: PT45S
    # Optional dedicated provider/model for titles (empty = provider of the conversation)
    provider: ${CHAT_TITLE_PROVIDER:}
    model: ${CHAT_TITLE_MODEL:}
  summary:
    enabled: true
    max-tokens: 1024
    max-messages-per-run: 40
    timeout: PT3M
    provider: ${CHAT_SUMMARY_PROVIDER:}
    model: ${CHAT_SUMMARY_MODEL:}
  compare:
    max-targets: 4

# --------------------------------------------------------------------------------------------------------------------
# LLM providers. Add a provider by adding an entry; "type" selects the adapter (openai | openai-compatible),
# "family" optional model-family tweaks (qwen | llama), "engine" the OpenAI-compatible server
# (generic | ollama | vllm | llama-cpp | lm-studio | localai | sglang).
# --------------------------------------------------------------------------------------------------------------------
llm:
  default-provider: ${LLM_DEFAULT_PROVIDER:openai}
  health:
    check-interval: ${LLM_HEALTH_INTERVAL:PT30S}
    initial-delay: PT2S
  models-cache-ttl: PT2M
  settings-reload-interval: PT15S

  providers:
    openai:
      enabled: ${OPENAI_ENABLED:true}
      type: openai
      display-name: OpenAI
      kind: CLOUD
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      organization: ${OPENAI_ORGANIZATION:}
      project: ${OPENAI_PROJECT:}
      default-model: ${OPENAI_MODEL:gpt-5.6-sol}
      # Comma separated allow-list shown in the UI; empty = discover chat models via GET /v1/models
      models: ${OPENAI_MODELS:}
      temperature: ${OPENAI_TEMPERATURE:}
      max-tokens: ${OPENAI_MAX_TOKENS:8192}
      timeout: ${OPENAI_TIMEOUT:PT120S}
      connect-timeout: PT10S
      health-timeout: PT10S
      store: false
      reasoning-model-prefixes: ${OPENAI_REASONING_MODEL_PREFIXES:o1,o3,o4,gpt-5}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:}
      reasoning-disabled-effort: ${OPENAI_REASONING_DISABLED_EFFORT:low}
      retry:
        max-attempts: 2
        initial-backoff: PT0.5S
        max-rate-limit-wait: PT5S
      circuit-breaker:
        failure-rate-threshold: 50
        sliding-window-size: 20
        minimum-number-of-calls: 5
        wait-duration-in-open-state: PT30S
      # USD per 1M tokens (verify against current OpenAI pricing). Longest matching model prefix wins.
      pricing:
        - { model: gpt-5-nano, input-per-million: 0.05, output-per-million: 0.40 }
        - { model: gpt-5-mini, input-per-million: 0.25, output-per-million: 2.00 }
        - { model: gpt-5, input-per-million: 1.25, output-per-million: 10.00 }
        - { model: gpt-4.1-nano, input-per-million: 0.10, output-per-million: 0.40 }
        - { model: gpt-4.1-mini, input-per-million: 0.40, output-per-million: 1.60 }
        - { model: gpt-4.1, input-per-million: 2.00, output-per-million: 8.00 }
        - { model: gpt-4o-mini, input-per-million: 0.15, output-per-million: 0.60 }
        - { model: gpt-4o, input-per-million: 2.50, output-per-million: 10.00 }
        - { model: o4-mini, input-per-million: 1.10, output-per-million: 4.40 }
        - { model: o3, input-per-million: 2.00, output-per-million: 8.00 }
      default-pricing:
        input-per-million: ${OPENAI_PRICE_INPUT_PER_MILLION:1.25}
        output-per-million: ${OPENAI_PRICE_OUTPUT_PER_MILLION:10.00}

    qwen:
      enabled: ${QWEN_ENABLED:true}
      type: openai-compatible
      family: qwen
      engine: ${QWEN_ENGINE:generic}
      display-name: Qwen Local
      kind: LOCAL
      base-url: ${QWEN_BASE_URL:http://localhost:8001/v1}
      api-key: ${QWEN_API_KEY:local}
      default-model: ${QWEN_MODEL:qwen}
      models: ${QWEN_MODELS:}
      temperature: ${QWEN_TEMPERATURE:0.7}
      max-tokens: ${QWEN_MAX_TOKENS:4096}
      # Local models may need time to load into memory before the first token arrives.
      timeout: ${QWEN_TIMEOUT:PT180S}
      connect-timeout: PT3S
      health-timeout: PT5S
      stream-usage: ${QWEN_STREAM_USAGE:true}
      retry:
        max-attempts: 2
        initial-backoff: PT0.5S
      circuit-breaker:
        wait-duration-in-open-state: PT20S

    llama:
      enabled: ${LLAMA_ENABLED:true}
      type: openai-compatible
      family: llama
      engine: ${LLAMA_ENGINE:generic}
      display-name: Llama Local
      kind: LOCAL
      base-url: ${LLAMA_BASE_URL:http://localhost:8002/v1}
      api-key: ${LLAMA_API_KEY:local}
      default-model: ${LLAMA_MODEL:llama}
      models: ${LLAMA_MODELS:}
      temperature: ${LLAMA_TEMPERATURE:0.7}
      max-tokens: ${LLAMA_MAX_TOKENS:4096}
      timeout: ${LLAMA_TIMEOUT:PT180S}
      connect-timeout: PT3S
      health-timeout: PT5S
      stream-usage: ${LLAMA_STREAM_USAGE:true}
      retry:
        max-attempts: 2
        initial-backoff: PT0.5S
      circuit-breaker:
        wait-duration-in-open-state: PT20S

    # Example: any other OpenAI-compatible server (Mistral/DeepSeek via vLLM, LM Studio, LocalAI, ...).
    # mistral:
    #   type: openai-compatible
    #   engine: vllm
    #   display-name: Mistral Local
    #   kind: LOCAL
    #   base-url: http://localhost:8003/v1
    #   default-model: mistralai/Mistral-7B-Instruct-v0.3

# --------------------------------------------------------------------------------------------------------------------
# Knowledge base (RAG). Independent of the chat providers: any chat model can be combined with any embedding model.
# --------------------------------------------------------------------------------------------------------------------
rag:
  enabled: ${RAG_ENABLED:true}
  chunking:
    strategy: ${RAG_CHUNKING_STRATEGY:recursive}
    # Estimated tokens (about 3.5 characters each); changing these requires a reindex.
    chunk-size: ${RAG_CHUNK_SIZE:800}
    overlap: ${RAG_CHUNK_OVERLAP:150}
  retrieval:
    # VECTOR or HYBRID (vector + PostgreSQL full-text search, merged with reciprocal rank fusion)
    mode: ${RAG_RETRIEVAL_MODE:VECTOR}
    top-k: ${RAG_TOP_K:8}
    # Minimum cosine similarity; depends on the embedding model (see README "Tuning retrieval").
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.70}
  context:
    max-tokens: ${RAG_CONTEXT_MAX_TOKENS:6000}
    max-chunks: ${RAG_CONTEXT_MAX_CHUNKS:8}
  embedding:
    # openai | openai-compatible (alias: ollama, vllm, lm-studio, localai, llama-cpp) | hashing (offline)
    provider: ${RAG_EMBEDDING_PROVIDER:openai}
    model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
    base-url: ${RAG_EMBEDDING_BASE_URL:https://api.openai.com/v1}
    api-key: ${RAG_EMBEDDING_API_KEY:${OPENAI_API_KEY:}}
    # 0 = model default; OpenAI text-embedding-3-* can shorten vectors
    dimensions: ${RAG_EMBEDDING_DIMENSIONS:0}
    batch-size: ${RAG_EMBEDDING_BATCH_SIZE:32}
    timeout: ${RAG_EMBEDDING_TIMEOUT:PT60S}
    # Instruction prefixes for models that need them (e.g. Qwen3-Embedding, nomic-embed-text); "\n" is a line break.
    query-prefix: ${RAG_EMBEDDING_QUERY_PREFIX:}
    document-prefix: ${RAG_EMBEDDING_DOCUMENT_PREFIX:}
  ingestion:
    max-file-size: ${RAG_MAX_FILE_SIZE:50MB}
    max-extracted-characters: ${RAG_MAX_EXTRACTED_CHARACTERS:5000000}
    max-text-entry-characters: ${RAG_MAX_TEXT_ENTRY_CHARACTERS:200000}
    concurrency: ${RAG_INGESTION_CONCURRENCY:2}
    extraction-timeout: ${RAG_EXTRACTION_TIMEOUT:PT5M}
  reranking:
    enabled: ${RAG_RERANKING_ENABLED:false}
    provider: ${RAG_RERANKING_PROVIDER:none}
  vector:
    store: pgvector
    create-index: ${RAG_VECTOR_CREATE_INDEX:true}
    ef-search: ${RAG_VECTOR_EF_SEARCH:100}
